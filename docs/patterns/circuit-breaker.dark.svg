<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-circuit-breaker-dark" viewBox="-25 -25 707.28 167.03" width="707.28" height="167.03" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-circuit-breaker-dark-title dg-p-circuit-breaker-dark-desc"><title id="dg-p-circuit-breaker-dark-title">Circuit breaker</title><desc id="dg-p-circuit-breaker-dark-desc">Calls pass through a breaker. When it is open they go to a fallback.</desc><style>.dg-p-circuit-breaker-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-p-circuit-breaker-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-circuit-breaker-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-circuit-breaker-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-circuit-breaker-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-circuit-breaker-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-circuit-breaker-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-circuit-breaker-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-circuit-breaker-dark text{font-family:inherit}
.dg-p-circuit-breaker-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-circuit-breaker-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-circuit-breaker-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-circuit-breaker-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-p-circuit-breaker-dark .role-primary .shape{stroke-width:2.55px}
.dg-p-circuit-breaker-dark .lbl{fill:var(--text);font-size:14px}
.dg-p-circuit-breaker-dark .card .lbl{font-weight:600}
.dg-p-circuit-breaker-dark .sub{fill:var(--text);font-size:12px}
.dg-p-circuit-breaker-dark .icon{color:var(--text)}
.dg-p-circuit-breaker-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-circuit-breaker-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-circuit-breaker-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-circuit-breaker-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-circuit-breaker-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-circuit-breaker-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-circuit-breaker-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-circuit-breaker-dark .canvas{fill:var(--dg-bg)}
.dg-p-circuit-breaker-dark.dim .node:not(.hot),.dg-p-circuit-breaker-dark.dim .edge:not(.hot),.dg-p-circuit-breaker-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-circuit-breaker-dark a{cursor:pointer}
.dg-p-circuit-breaker-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="707.28" height="167.03" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="client" data-to="cb"><title>Caller to Circuit breaker</title><path class="edge-line" d="M76.72 90.93L126.72 90.93"/><path class="arrow" d="M126.72 90.93L117.72 95.43L117.72 86.43z"/></g><g class="edge" data-id="e2" data-from="cb" data-to="svc"><title>Circuit breaker to Payments API: closed: call through</title><path class="edge-line" d="M276.52 84.57L286.52 84.57L286.52 19.1L523.72 19.1"/><path class="arrow" d="M523.72 19.1L514.72 23.6L514.72 14.6z"/></g><g class="edge" data-id="e3" data-from="cb" data-to="fb"><title>Circuit breaker to Cached answer: open: fall back</title><path class="edge-line" stroke-dasharray="6 4" d="M276.52 97.3L523.72 97.3"/><path class="arrow" d="M523.72 97.3L514.72 101.8L514.72 92.8z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e2"><rect class="edge-label-box" x="325.52" y="-3.5" width="149.2" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="400.12" y="6.3">closed: call through</tspan></text></g><g class="edge-label-group" data-edge="e3"><rect class="edge-label-box" x="342.92" y="100.3" width="114.4" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="400.12" y="110.1">open: fall back</tspan></text></g></g><g class="nodes"><g class="node type-actor role-default" id="dg-p-circuit-breaker-dark-n-client" data-id="client"><rect class="shape" x="0" y="55.83" width="76.72" height="70.2" rx="8"/><circle class="glyph" cx="38.36" cy="68.83" r="5.5"/><path class="glyph" d="M28.36 83.83a10 9 0 0 1 20 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="38.36" y="106.93">Caller</tspan></text></g><g class="node type-box role-warning" id="dg-p-circuit-breaker-dark-n-cb" data-id="cb"><rect class="shape" x="126.72" y="71.83" width="149.8" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="201.62" y="90.93">Circuit breaker</tspan></text><g class="role-badge" data-role="warning" transform="translate(276.52 71.83)"><path class="badge" d="M0 -9 9 7H-9z"/><path class="glyph" d="M0 -3V1.5M0 4.3h.01"/></g></g><g class="node type-box role-danger" id="dg-p-circuit-breaker-dark-n-svc" data-id="svc"><rect class="shape" x="523.72" y="0" width="125.44" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="586.44" y="19.1">Payments API</tspan></text><g class="role-badge" data-role="danger" transform="translate(649.16 0)"><rect class="badge" x="-6.5" y="-6.5" width="13" height="13" rx="2" transform="rotate(45)"/><path class="glyph" d="M-2.8 -2.8 2.8 2.8M2.8 -2.8-2.8 2.8"/></g></g><g class="node type-box role-muted" id="dg-p-circuit-breaker-dark-n-fb" data-id="fb"><rect class="shape" x="523.72" y="78.2" width="133.56" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="590.5" y="97.3">Cached answer</tspan></text></g></g></svg>
