<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-request-reply-light" viewBox="-25 -25 639 111.2" width="639" height="111.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-request-reply-light-title dg-p-request-reply-light-desc"><title id="dg-p-request-reply-light-title">Request and reply</title><desc id="dg-p-request-reply-light-desc">A client sends a request to a service, which asks the database and replies.</desc><style>.dg-p-request-reply-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-p-request-reply-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-request-reply-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-request-reply-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-request-reply-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-request-reply-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-request-reply-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-request-reply-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-request-reply-light text{font-family:inherit}
.dg-p-request-reply-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-request-reply-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-request-reply-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-request-reply-light .role-muted .shape{stroke-dasharray:5 3}
.dg-p-request-reply-light .role-primary .shape{stroke-width:2.55px}
.dg-p-request-reply-light .lbl{fill:var(--text);font-size:14px}
.dg-p-request-reply-light .card .lbl{font-weight:600}
.dg-p-request-reply-light .sub{fill:var(--text);font-size:12px}
.dg-p-request-reply-light .icon{color:var(--text)}
.dg-p-request-reply-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-request-reply-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-request-reply-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-request-reply-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-request-reply-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-request-reply-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-request-reply-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-request-reply-light .canvas{fill:var(--dg-bg)}
.dg-p-request-reply-light.dim .node:not(.hot),.dg-p-request-reply-light.dim .edge:not(.hot),.dg-p-request-reply-light.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-request-reply-light a{cursor:pointer}
.dg-p-request-reply-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="639" height="111.2" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="client" data-to="svc"><title>Client to Service: request</title><path class="edge-line" d="M76.72 16.4L240.4 16.4"/><path class="arrow" d="M240.4 16.4L231.4 20.9L231.4 11.9z"/></g><g class="edge" data-id="e2" data-from="svc" data-to="client"><title>Service to Client: response</title><path class="edge-line" stroke-dasharray="6 4" d="M240.86 43.12L87.18 43.12L87.18 53.79L77.18 53.79"/><path class="arrow" d="M77.18 53.79L86.18 49.29L86.18 58.29z"/></g><g class="edge" data-id="e3" data-from="svc" data-to="db"><title>Service to Database: query</title><path class="edge-line" d="M353.24 30.4L496.04 30.4"/><path class="arrow" d="M496.04 30.4L487.04 34.9L487.04 25.9z"/></g><g class="edge" data-id="e4" data-from="db" data-to="svc"><title>Database to Service: rows</title><path class="edge-line" stroke-dasharray="6 4" d="M496.43 37.14L363.63 37.14L363.63 29.14L353.63 29.14"/><path class="arrow" d="M353.63 29.14L362.63 24.64L362.63 33.64z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e1"><rect class="edge-label-box" x="129.2" y="-6.2" width="58.72" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="158.56" y="3.6">request</tspan></text></g><g class="edge-label-group" data-edge="e2"><rect class="edge-label-box" x="126.18" y="46.12" width="65.68" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="159.02" y="55.92">response</tspan></text></g><g class="edge-label-group" data-edge="e3"><rect class="edge-label-box" x="402.24" y="7.8" width="44.8" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="424.64" y="17.6">query</tspan></text></g><g class="edge-label-group" data-edge="e4"><rect class="edge-label-box" x="406.11" y="40.14" width="37.84" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="425.03" y="49.94">rows</tspan></text></g></g><g class="nodes"><g class="node type-actor role-default" id="dg-p-request-reply-light-n-client" data-id="client"><rect class="shape" x="0" y="0" width="76.72" height="70.2" rx="8"/><circle class="glyph" cx="38.36" cy="13" r="5.5"/><path class="glyph" d="M28.36 28a10 9 0 0 1 20 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="38.36" y="51.1">Client</tspan></text></g><g class="node type-box role-default" id="dg-p-request-reply-light-n-svc" data-id="svc"><rect class="shape" x="240.4" y="10.67" width="112.84" height="38.2" rx="8"/><g class="icon" transform="translate(254.4 19.77) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="310.82" y="29.77">Service</tspan></text></g><g class="node type-database role-default" id="dg-p-request-reply-light-n-db" data-id="db"><path class="shape" d="M496.04 10.67a46.48 8 0 0 1 92.96 0v46.2a46.48 8 0 0 1 -92.96 0z"/><path class="glyph" d="M496.04 10.67a46.48 8 0 0 0 92.96 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="542.52" y="37.77">Database</tspan></text></g></g></svg>
