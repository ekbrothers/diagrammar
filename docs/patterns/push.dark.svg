<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-push-dark" viewBox="-25 -25 491.56 239.1" width="491.56" height="239.1" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-push-dark-title dg-p-push-dark-desc"><title id="dg-p-push-dark-title">Push delivery</title><desc id="dg-p-push-dark-desc">A publisher sends each event to its subscribers as it happens.</desc><style>.dg-p-push-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-p-push-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-push-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-push-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-push-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-push-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-push-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-push-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-push-dark text{font-family:inherit}
.dg-p-push-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-push-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-push-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-push-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-p-push-dark .role-primary .shape{stroke-width:2.55px}
.dg-p-push-dark .lbl{fill:var(--text);font-size:14px}
.dg-p-push-dark .card .lbl{font-weight:600}
.dg-p-push-dark .sub{fill:var(--text);font-size:12px}
.dg-p-push-dark .icon{color:var(--text)}
.dg-p-push-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-push-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-push-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-push-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-push-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-push-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-push-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-push-dark .canvas{fill:var(--dg-bg)}
.dg-p-push-dark.dim .node:not(.hot),.dg-p-push-dark.dim .edge:not(.hot),.dg-p-push-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-push-dark a{cursor:pointer}
.dg-p-push-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="491.56" height="239.1" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="pub" data-to="a"><title>Order service to Email: event</title><path class="edge-line" d="M161.56 28.65L181.56 28.65L181.56 97.3L304.36 97.3"/><path class="arrow" d="M304.36 97.3L295.36 101.8L295.36 92.8z"/></g><g class="edge" data-id="e2" data-from="pub" data-to="b"><title>Order service to Mobile app: event</title><path class="edge-line" d="M161.56 38.2L171.56 38.2L171.56 175.5L304.36 175.5"/><path class="arrow" d="M304.36 175.5L295.36 180L295.36 171z"/></g><g class="edge" data-id="e3" data-from="pub" data-to="c"><title>Order service to Webhook: event</title><path class="edge-line" d="M161.56 19.1L304.36 19.1"/><path class="arrow" d="M304.36 19.1L295.36 23.6L295.36 14.6z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e1"><rect class="edge-label-box" x="210.56" y="100.3" width="44.8" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="232.96" y="110.1">event</tspan></text></g><g class="edge-label-group" data-edge="e2"><rect class="edge-label-box" x="210.56" y="178.5" width="44.8" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="232.96" y="188.3">event</tspan></text></g><g class="edge-label-group" data-edge="e3"><rect class="edge-label-box" x="210.56" y="22.1" width="44.8" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="232.96" y="31.9">event</tspan></text></g></g><g class="nodes"><g class="node type-box role-default" id="dg-p-push-dark-n-pub" data-id="pub"><rect class="shape" x="0" y="9.55" width="161.56" height="38.2" rx="8"/><g class="icon" transform="translate(14 18.65) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="94.78" y="28.65">Order service</tspan></text></g><g class="node type-box role-default" id="dg-p-push-dark-n-a" data-id="a"><rect class="shape" x="304.36" y="78.2" width="96.6" height="38.2" rx="8"/><g class="icon" transform="translate(318.36 87.3) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="366.66" y="97.3">Email</tspan></text></g><g class="node type-box role-default" id="dg-p-push-dark-n-b" data-id="b"><rect class="shape" x="304.36" y="156.4" width="137.2" height="38.2" rx="8"/><g class="icon" transform="translate(318.36 165.5) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="386.96" y="175.5">Mobile app</tspan></text></g><g class="node type-box role-default" id="dg-p-push-dark-n-c" data-id="c"><rect class="shape" x="304.36" y="0" width="112.84" height="38.2" rx="8"/><g class="icon" transform="translate(318.36 9.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="374.78" y="19.1">Webhook</tspan></text></g></g></svg>
