<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-pull-dark" viewBox="-25 -25 482.12 82.07" width="482.12" height="82.07" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-pull-dark-title dg-p-pull-dark-desc"><title id="dg-p-pull-dark-title">Pull delivery</title><desc id="dg-p-pull-dark-desc">A worker polls a queue and gets a job or nothing.</desc><style>.dg-p-pull-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-p-pull-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-pull-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-pull-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-pull-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-pull-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-pull-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-pull-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-pull-dark text{font-family:inherit}
.dg-p-pull-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-pull-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-pull-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-pull-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-p-pull-dark .role-primary .shape{stroke-width:2.55px}
.dg-p-pull-dark .lbl{fill:var(--text);font-size:14px}
.dg-p-pull-dark .card .lbl{font-weight:600}
.dg-p-pull-dark .sub{fill:var(--text);font-size:12px}
.dg-p-pull-dark .icon{color:var(--text)}
.dg-p-pull-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-pull-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-pull-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-pull-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-pull-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-pull-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-pull-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-pull-dark .canvas{fill:var(--dg-bg)}
.dg-p-pull-dark.dim .node:not(.hot),.dg-p-pull-dark.dim .edge:not(.hot),.dg-p-pull-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-pull-dark a{cursor:pointer}
.dg-p-pull-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="482.12" height="82.07" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="worker" data-to="queue"><title>Worker to Job queue: any work?</title><path class="edge-line" d="M327.4 18.47L101.08 18.47"/><path class="arrow" d="M101.08 18.47L110.08 13.97L110.08 22.97z"/></g><g class="edge" data-id="e2" data-from="queue" data-to="worker"><title>Job queue to Worker: a job, or nothing</title><path class="edge-line" stroke-dasharray="6 4" d="M101.08 19.73L327.4 19.73"/><path class="arrow" d="M327.4 19.73L318.4 24.23L318.4 15.23z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e1"><rect class="edge-label-box" x="177.92" y="21.47" width="72.64" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="214.24" y="31.27">any work?</tspan></text></g><g class="edge-label-group" data-edge="e2"><rect class="edge-label-box" x="150.08" y="-2.87" width="128.32" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="214.24" y="6.93">a job, or nothing</tspan></text></g></g><g class="nodes"><g class="node type-box role-default" id="dg-p-pull-dark-n-worker" data-id="worker"><rect class="shape" x="327.4" y="0" width="104.72" height="38.2" rx="8"/><g class="icon" transform="translate(341.4 9.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="393.76" y="19.1">Worker</tspan></text></g><g class="node type-pill role-warning" id="dg-p-pull-dark-n-queue" data-id="queue"><rect class="shape" x="0" y="0" width="101.08" height="38.2" rx="19.1"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="50.54" y="19.1">Job queue</tspan></text><g class="role-badge" data-role="warning" transform="translate(101.08 0)"><path class="badge" d="M0 -9 9 7H-9z"/><path class="glyph" d="M0 -3V1.5M0 4.3h.01"/></g></g></g></svg>
