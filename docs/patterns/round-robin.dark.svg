<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-round-robin-dark" viewBox="-25 -25 631.04 239.1" width="631.04" height="239.1" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-round-robin-dark-title dg-p-round-robin-dark-desc"><title id="dg-p-round-robin-dark-title">Round-robin load balancing</title><desc id="dg-p-round-robin-dark-desc">Requests go to server 1, 2, 3, then 1 again.</desc><style>.dg-p-round-robin-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-p-round-robin-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-round-robin-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-round-robin-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-round-robin-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-round-robin-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-round-robin-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-round-robin-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-round-robin-dark text{font-family:inherit}
.dg-p-round-robin-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-round-robin-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-round-robin-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-round-robin-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-p-round-robin-dark .role-primary .shape{stroke-width:2.55px}
.dg-p-round-robin-dark .lbl{fill:var(--text);font-size:14px}
.dg-p-round-robin-dark .card .lbl{font-weight:600}
.dg-p-round-robin-dark .sub{fill:var(--text);font-size:12px}
.dg-p-round-robin-dark .icon{color:var(--text)}
.dg-p-round-robin-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-round-robin-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-round-robin-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-round-robin-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-round-robin-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-round-robin-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-round-robin-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-round-robin-dark .canvas{fill:var(--dg-bg)}
.dg-p-round-robin-dark.dim .node:not(.hot),.dg-p-round-robin-dark.dim .edge:not(.hot),.dg-p-round-robin-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-round-robin-dark a{cursor:pointer}
.dg-p-round-robin-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="631.04" height="239.1" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="client" data-to="lb"><title>Clients to Load balancer</title><path class="edge-line" d="M84.84 97.3L134.84 97.3"/><path class="arrow" d="M134.84 97.3L125.84 101.8L125.84 92.8z"/></g><g class="edge" data-id="e2" data-from="lb" data-to="s1"><title>Load balancer to Server 1: 1st, 4th</title><path class="edge-line" d="M296.4 97.3L460.08 97.3"/><path class="arrow" d="M460.08 97.3L451.08 101.8L451.08 92.8z"/></g><g class="edge" data-id="e3" data-from="lb" data-to="s2"><title>Load balancer to Server 2: 2nd, 5th</title><path class="edge-line" d="M296.4 106.85L306.4 106.85L306.4 175.5L460.08 175.5"/><path class="arrow" d="M460.08 175.5L451.08 180L451.08 171z"/></g><g class="edge" data-id="e4" data-from="lb" data-to="s3"><title>Load balancer to Server 3: 3rd, 6th</title><path class="edge-line" d="M296.4 87.75L306.4 87.75L306.4 19.1L460.08 19.1"/><path class="arrow" d="M460.08 19.1L451.08 23.6L451.08 14.6z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e2"><rect class="edge-label-box" x="345.4" y="100.3" width="65.68" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="378.24" y="110.1">1st, 4th</tspan></text></g><g class="edge-label-group" data-edge="e3"><rect class="edge-label-box" x="345.4" y="178.5" width="65.68" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="378.24" y="188.3">2nd, 5th</tspan></text></g><g class="edge-label-group" data-edge="e4"><rect class="edge-label-box" x="345.4" y="22.1" width="65.68" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="378.24" y="31.9">3rd, 6th</tspan></text></g></g><g class="nodes"><g cla