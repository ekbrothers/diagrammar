<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-saga-dark" viewBox="-25 -25 979.56 141.8" width="979.56" height="141.8" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-saga-dark-title dg-p-saga-dark-desc"><title id="dg-p-saga-dark-title">Saga with compensation</title><desc id="dg-p-saga-dark-desc">Order, payment, and stock steps, with a refund and cancellation when a step fails.</desc><style>.dg-p-saga-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-p-saga-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-saga-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-saga-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-saga-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-saga-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-saga-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-saga-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-saga-dark text{font-family:inherit}
.dg-p-saga-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-saga-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-saga-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-saga-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-p-saga-dark .role-primary .shape{stroke-width:2.55px}
.dg-p-saga-dark .lbl{fill:var(--text);font-size:14px}
.dg-p-saga-dark .card .lbl{font-weight:600}
.dg-p-saga-dark .sub{fill:var(--text);font-size:12px}
.dg-p-saga-dark .icon{color:var(--text)}
.dg-p-saga-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-saga-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-saga-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-saga-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-saga-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-saga-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-saga-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-saga-dark .canvas{fill:var(--dg-bg)}
.dg-p-saga-dark.dim .node:not(.hot),.dg-p-saga-dark.dim .edge:not(.hot),.dg-p-saga-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-saga-dark a{cursor:pointer}
.dg-p-saga-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="979.56" height="141.8" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="order" data-to="pay"><title>Create order to Charge card</title><path class="edge-line" d="M125.44 25.47L175.44 25.47"/><path class="arrow" d="M175.44 25.47L166.44 29.97L166.44 20.97z"/></g><g class="edge" data-id="e2" data-from="pay" data-to="ship"><title>Charge card to Reserve stock</title><path class="edge-line" d="M292.76 25.47L342.76 25.47"/><path class="arrow" d="M342.76 25.47L333.76 29.97L333.76 20.97z"/></g><g class="edge" data-id="e3" data-from="ship" data-to="done"><title>Reserve stock to Confirmed</title><path class="edge-line" d="M476.32 19.1L526.32 19.1"/><path class="arrow" d="M526.32 19.1L517.32 23.6L517.32 14.6z"/></g><g class="edge" data-id="e4" data-from="ship" data-to="refund"><title>Reserve stock to Refund: out of stock</title><path class="edge-line" stroke-dasharray="6 4" d="M476.32 31.83L486.32 31.83L486.32 78.2L677.4 78.2"/><path class="arrow" d="M677.4 78.2L668.4 82.7L668.4 73.7z"/></g><g class="edge" data-id="e5" data-from="refund" data-to="cancel"><title>Refund to Cancel order</title><path class="edge-line" stroke-dasharray="6 4" d="M754.12 78.2L804.12 78.2"/><path class="arrow" d="M804.12 78.2L795.12 82.7L795.12 73.7z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e4"><rect class="edge-label-box" x="530.1" y="81.2" width="93.52" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="576.86" y="91">out of stock</tspan></text></g></g><g class="nodes"><g class="node type-box role-default" id="dg-p-saga-dark-n-order" data-id="order"><rect class="shape" x="0" y="6.37" width="125.44" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="62.72" y="25.47">Create order</tspan></text></g><g class="node type-box role-default" id="dg-p-saga-dark-n-pay" data-id="pay"><rect class="shape" x="175.44" y="6.37" width="117.32" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="234.1" y="25.47">Charge card</tspan></text></g><g class="node type-box role-default" id="dg-p-saga-dark-n-ship" data-id="ship"><rect class="shape" x="342.76" y="6.37" width="133.56" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="409.54" y="25.47">Reserve stock</tspan></text></g><g class="node type-box role-success" id="dg-p-saga-dark-n-done" data-id="done"><rect class="shape" x="526.32" y="0" width="101.08" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="576.86" y="19.1">Confirmed</tspan></text><g class="role-badge" data-role="success" transform="translate(627.4 0)"><circle class="badge" r="8"/><path class="glyph" d="M-3.5 0.5 -1 3 3.5 -2.5"/></g></g><g class="node type-box role-danger" id="dg-p-saga-dark-n-refund" data-id="refund"><rect class="shape" x="677.4" y="59.1" width="76.72" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="715.76" y="78.2">Refund</tspan></text><g class="role-badge" data-role="danger" transform="translate(754.12 59.1)"><rect class="badge" x="-6.5" y="-6.5" width="13" height="13" rx="2" transform="rotate(45)"/><path class="glyph" d="M-2.8 -2.8 2.8 2.8M2.8 -2.8-2.8 2.8"/></g></g><g class="node type-box role-danger" id="dg-p-saga-dark-n-cancel" data-id="cancel"><rect class="shape" x="804.12" y="59.1" width="125.44" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="866.84" y="78.2">Cancel order</tspan></text><g class="role-badge" data-role="danger" transform="translate(929.56 59.1)"><rect class="badge" x="-6.5" y="-6.5" width="13" height="13" rx="2" transform="rotate(45)"/><path class="glyph" d="M-2.8 -2.8 2.8 2.8M2.8 -2.8-2.8 2.8"/></g></g></g></svg>
