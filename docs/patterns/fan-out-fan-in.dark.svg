.dg-p-fan-out-fan-in-dark .canvas{fill:var(--dg-bg)}
.dg-p-fan-out-fan-in-dark.dim .node:not(.hot),.dg-p-fan-out-fan-in-dark.dim .edge:not(.hot),.dg-p-fan-out-fan-in-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-fan-out-fan-in-dark a{cursor:pointer}
