<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-static-site-dark" viewBox="-25 -25 702.96 176.9" width="702.96" height="176.9" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-static-site-dark-title dg-p-static-site-dark-desc"><title id="dg-p-static-site-dark-title">Static site behind a CDN</title><desc id="dg-p-static-site-dark-desc">A build pipeline uploads to storage. Visitors are served by the CDN, which fetches from storage on a miss.</desc><style>.dg-p-static-site-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-p-static-site-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-static-site-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-static-site-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-static-site-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-static-site-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-static-site-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-static-site-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-static-site-dark text{font-family:inherit}
.dg-p-static-site-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-static-site-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-static-site-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-static-site-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-p-static-site-dark .role-primary .shape{stroke-width:2.55px}
.dg-p-static-site-dark .lbl{fill:var(--text);font-size:14px}
.dg-p-static-site-dark .card .lbl{font-weight:600}
.dg-p-static-site-dark .sub{fill:var(--text);font-size:12px}
.dg-p-static-site-dark .icon{color:var(--text)}
.dg-p-static-site-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-static-site-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-static-site-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-static-site-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-static-site-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-static-site-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-static-site-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-static-site-dark .canvas{fill:var(--dg-bg)}
.dg-p-static-site-dark.dim .node:not(.hot),.dg-p-static-site-dark.dim .edge:not(.hot),.dg-p-static-site-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-static-site-dark a{cursor:pointer}
.dg-p-static-site-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="702.96" height="176.9" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="ci" data-to="store"><title>Build pipeline to Storage bucket: upload</title><path class="edge-line" d="M312.64 113.3L443.28 113.3L443.28 47.83L483.28 47.83"/><path class="arrow" d="M483.28 47.83L474.28 52.33L474.28 43.33z"/></g><g class="edge" data-id="e2" data-from="cdn" data-to="store"><title>CDN to Storage bucket: on a miss</title><path class="edge-line" stroke-dasharray="6 4" d="M267.98 35.1L483.28 35.1"/><path class="arrow" d="M483.28 35.1L474.28 39.6L474.28 30.6z"/></g><g class="edge" data-id="e3" data-from="user" data-to="cdn"><title>Visitors to CDN</title><path class="edge-line" d="M92.96 35.1L187.62 35.1"/><path class="arrow" d="M187.62 35.1L178.62 39.6L178.62 30.6z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e1"><rect class="edge-label-box" x="372.08" y="116.3" width="51.76" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="397.96" y="126.1">upload</tspan></text></g><g class="edge-label-group" data-edge="e2"><rect class="edge-label-box" x="361.64" y="12.5" width="72.64" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="397.96" y="22.3">on a miss</tspan></text></g></g><g class="nodes"><g class="node type-box role-default" id="dg-p-static-site-dark-n-ci" data-id="ci"><rect class="shape" x="142.96" y="94.2" width="169.68" height="38.2" rx="8"/><g class="icon" transform="translate(156.96 103.3) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="241.8" y="113.3">Build pipeline</tspan></text></g><g class="node type-box role-default" id="dg-p-static-site-dark-n-store" data-id="store"><rect class="shape" x="483.28" y="22.37" width="169.68" height="38.2" rx="8"/><g class="icon" transform="translate(497.28 31.47) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="582.12" y="41.47">Storage bucket</tspan></text></g><g class="node type-box role-primary" id="dg-p-static-site-dark-n-cdn" data-id="cdn"><rect class="shape" x="187.62" y="16" width="80.36" height="38.2" rx="8"/><g class="icon" transform="translate(201.62 25.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="241.8" y="35.1">CDN</tspan></text></g><g class="node type-actor role-default" id="dg-p-static-site-dark-n-user" data-id="user"><rect class="shape" x="0" y="0" width="92.96" height="70.2" rx="8"/><circle class="glyph" cx="46.48" cy="13" r="5.5"/><path class="glyph" d="M36.48 28a10 9 0 0 1 20 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="46.48" y="51.1">Visitors</tspan></text></g></g></svg>
