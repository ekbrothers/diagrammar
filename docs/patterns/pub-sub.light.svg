<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-pub-sub-light" viewBox="-25 -25 604.2 235.6" width="604.2" height="235.6" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-pub-sub-light-title dg-p-pub-sub-light-desc"><title id="dg-p-pub-sub-light-title">Publish and subscribe</title><desc id="dg-p-pub-sub-light-desc">One publisher, one topic, three independent subscribers.</desc><style>.dg-p-pub-sub-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-p-pub-sub-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-pub-sub-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-pub-sub-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-pub-sub-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-pub-sub-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-pub-sub-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-pub-sub-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-pub-sub-light text{font-family:inherit}
.dg-p-pub-sub-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-pub-sub-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-pub-sub-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-pub-sub-light .role-muted .shape{stroke-dasharray:5 3}
.dg-p-pub-sub-light .role-primary .shape{stroke-width:2.55px}
.dg-p-pub-sub-light .lbl{fill:var(--text);font-size:14px}
.dg-p-pub-sub-light .card .lbl{font-weight:600}
.dg-p-pub-sub-light .sub{fill:var(--text);font-size:12px}
.dg-p-pub-sub-light .icon{color:var(--text)}
.dg-p-pub-sub-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-pub-sub-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-pub-sub-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-pub-sub-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-pub-sub-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-pub-sub-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-pub-sub-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-pub-sub-light .canvas{fill:var(--dg-bg)}
.dg-p-pub-sub-light.dim .node:not(.hot),.dg-p-pub-sub-light.dim .edge:not(.hot),.dg-p-pub-sub-light.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-pub-sub-light a{cursor:pointer}
.dg-p-pub-sub-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="604.2" height="235.6" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="pub" data-to="topic"><title>Checkout to orders topic: publish</title><path class="edge-line" d="M120.96 28.65L277.68 28.65"/><path class="arrow" d="M277.68 28.65L268.68 33.15L268.68 24.15z"/></g><g class="edge" data-id="e2" data-from="topic" data-to="billing"><title>orders topic to Billing</title><path class="edge-line" d="M403.12 28.65L423.12 28.65L423.12 97.3L453.12 97.3"/><path class="arrow" d="M453.12 97.3L444.12 101.8L444.12 92.8z"/></g><g class="edge" data-id="e3" data-from="topic" data-to="ship"><title>orders topic to Shipping</title><path class="edge-line" d="M403.12 38.2L413.12 38.2L413.12 175.5L453.12 175.5"/><path class="arrow" d="M453.12 175.5L444.12 180L444.12 171z"/></g><g class="edge" data-id="e4" data-from="topic" data-to="stats"><title>orders topic to Analytics</title><path class="edge-line" d="M403.12 19.1L453.12 19.1"/><path class="arrow" d="M453.12 19.1L444.12 23.6L444.12 14.6z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e1"><rect class="edge-label-box" x="169.96" y="31.65" width="58.72" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="199.32" y="41.45">publish</tspan></text></g></g><g class="nodes"><g class="node type-box role-default" id="dg-p-pub-sub-light-n-pub" data-id="pub"><rect class="shape" x="0" y="9.55" width="120.96" height="38.2" rx="8"/><g class="icon" transform="translate(14 18.65) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="74.48" y="28.65">Checkout</tspan></text></g><g class="node type-pill role-primary" id="dg-p-pub-sub-light-n-topic" data-id="topic"><rect class="shape" x="277.68" y="9.55" width="125.44" height="38.2" rx="19.1"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="340.4" y="28.65">orders topic</tspan></text></g><g class="node type-box role-default" id="dg-p-pub-sub-light-n-billing" data-id="billing"><rect class="shape" x="453.12" y="78.2" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="495.54" y="97.3">Billing</tspan></text></g><g class="node type-box role-default" id="dg-p-pub-sub-light-n-ship" data-id="ship"><rect class="shape" x="453.12" y="156.4" width="92.96" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="499.6" y="175.5">Shipping</tspan></text></g><g class="node type-box role-muted" id="dg-p-pub-sub-light-n-stats" data-id="stats"><rect class="shape" x="453.12" y="0" width="101.08" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="503.66" y="19.1">Analytics</tspan></text></g></g></svg>
