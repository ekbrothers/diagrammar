<svg xmlns="http://www.w3.org/2000/svg" class="dg-p-cqrs-dark" viewBox="-25 -25 873.76 181.4" width="873.76" height="181.4" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-p-cqrs-dark-title dg-p-cqrs-dark-desc"><title id="dg-p-cqrs-dark-title">CQRS</title><desc id="dg-p-cqrs-dark-desc">Commands write to one database, and queries read from a separate, denormalized one.</desc><style>.dg-p-cqrs-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-p-cqrs-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-p-cqrs-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-p-cqrs-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-p-cqrs-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-p-cqrs-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-p-cqrs-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-p-cqrs-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-p-cqrs-dark text{font-family:inherit}
.dg-p-cqrs-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-cqrs-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-cqrs-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-p-cqrs-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-p-cqrs-dark .role-primary .shape{stroke-width:2.55px}
.dg-p-cqrs-dark .lbl{fill:var(--text);font-size:14px}
.dg-p-cqrs-dark .card .lbl{font-weight:600}
.dg-p-cqrs-dark .sub{fill:var(--text);font-size:12px}
.dg-p-cqrs-dark .icon{color:var(--text)}
.dg-p-cqrs-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-p-cqrs-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-p-cqrs-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-p-cqrs-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-p-cqrs-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-p-cqrs-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-p-cqrs-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-p-cqrs-dark .canvas{fill:var(--dg-bg)}
.dg-p-cqrs-dark.dim .node:not(.hot),.dg-p-cqrs-dark.dim .edge:not(.hot),.dg-p-cqrs-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-p-cqrs-dark a{cursor:pointer}
.dg-p-cqrs-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="873.76" height="181.4" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="client" data-to="cmd"><title>Client to Command API: commands</title><path class="edge-line" d="M76.72 109.3L240.4 109.3"/><path class="arrow" d="M240.4 109.3L231.4 113.8L231.4 104.8z"/></g><g class="edge" data-id="e2" data-from="cmd" data-to="w"><title>Command API to Write store</title><path class="edge-line" d="M385.72 109.3L441.6 109.3"/><path class="arrow" d="M441.6 109.3L432.6 113.8L432.6 104.8z"/></g><g class="edge" data-id="e3" data-from="w" data-to="r"><title>Write store to Read store: events</title><path class="edge-line" stroke-dasharray="6 4" d="M558.92 109.3L714.56 109.3"/><path class="arrow" d="M714.56 109.3L705.56 113.8L705.56 104.8z"/></g><g class="edge" data-id="e4" data-from="client" data-to="q"><title>Client to Query API: queries</title><path class="edge-line" d="M76.72 85.9L86.72 85.9L86.72 19.1L435.72 19.1"/><path class="arrow" d="M435.72 19.1L426.72 23.6L426.72 14.6z"/></g><g class="edge" data-id="e5" data-from="q" data-to="r"><title>Query API to Read store</title><path class="edge-line" d="M564.8 19.1L674.56 19.1L674.56 88.57L714.56 88.57"/><path class="arrow" d="M714.56 88.57L705.56 93.07L705.56 84.07z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e1"><rect class="edge-label-box" x="125.72" y="112.3" width="65.68" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="158.56" y="122.1">commands</tspan></text></g><g class="edge-label-group" data-edge="e3"><rect class="edge-label-box" x="613.8" y="112.3" width="51.76" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="639.68" y="122.1">events</tspan></text></g><g class="edge-label-group" data-edge="e4"><rect class="