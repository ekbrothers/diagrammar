<svg xmlns="http://www.w3.org/2000/svg" class="dg-cloud-dark" viewBox="-25 -16 1126.52 437.4" width="1126.52" height="437.4" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-cloud-dark-title dg-cloud-dark-desc"><title id="dg-cloud-dark-title">Web app on AWS</title><desc id="dg-cloud-dark-desc">Visitors reach CloudFront, which serves static files from S3 and sends requests to a load balancer in front of two app servers and a database.</desc><style>.dg-cloud-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-cloud-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-cloud-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-cloud-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-cloud-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-cloud-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-cloud-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-cloud-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-cloud-dark text{font-family:inherit}
.dg-cloud-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-cloud-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-cloud-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-cloud-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-cloud-dark .role-primary .shape{stroke-width:2.55px}
.dg-cloud-dark .lbl{fill:var(--text);font-size:14px}
.dg-cloud-dark .card .lbl{font-weight:600}
.dg-cloud-dark .sub{fill:var(--text);font-size:12px}
.dg-cloud-dark .icon{color:var(--text)}
.dg-cloud-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-cloud-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-cloud-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-cloud-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-cloud-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-cloud-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-cloud-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-cloud-dark .canvas{fill:var(--dg-bg)}
.dg-cloud-dark.dim .node:not(.hot),.dg-cloud-dark.dim .edge:not(.hot),.dg-cloud-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-cloud-dark a{cursor:pointer}
.dg-cloud-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-16" width="1126.52" height="437.4" rx="8"/><g class="groups"><g class="group" id="dg-cloud-dark-g-region" data-id="region"><rect class="group-box" x="147.96" y="0" width="937.56" height="405.4" rx="8"/><text class="group-label" x="157.96" y="15" dominant-baseline="central">us-east-1</text></g><g class="group" id="dg-cloud-dark-g-vpc" data-id="vpc"><rect class="group-box" x="406.88" y="44" width="658.64" height="263.6" rx="8"/><text class="group-label" x="416.88" y="59" dominant-baseline="central">VPC 10.0.0.0/16</text></g><g class="group" id="dg-cloud-dark-g-public" data-id="public"><rect class="group-box" x="431.88" y="97.63" width="201.56" height="121.8" rx="8"/><text class="group-label" x="441.88" y="112.63" dominant-baseline="central">Public subnet</text></g><g class="group" id="dg-cloud-dark-g-private" data-id="private"><rect class="group-box" x="663.44" y="88" width="172.56" height="199.6" rx="8"/><text class="group-label" x="673.44" y="103" dominant-baseline="central">Private subnets</text></g><g class="group" id="dg-cloud-dark-g-data" data-id="data"><rect class="group-box" x="866" y="97.63" width="179.52" height="121.8" rx="8"/><text class="group-label" x="876" y="112.63" dominant-baseline="central">Data subnet</text></g></g><g class="edges"><g class="edge" data-id="e1" data-from="users" data-to="cdn"><title>Visitors to CloudFront</title><path class="edge-line" d="M92.96 176.9L167.96 176.9"/><path class="arrow" d="M167.96 176.9L158.96 181.4L158.96 172.4z"/></g><g class="edge" data-id="e2" data-from="cdn" data-to="assets"><title>CloudFront to Static files: /static</title><path class="edge-line" d="M305.16 183.27L315.16 183.27L315.16 356.5L406.88 356.5"/><path class="arrow" d="M406.88 356.5L397.88 361L397.88 352z"/></g><g class="edge" data-id="e3" data-from="cdn" data-to="alb"><title>CloudFront to Load balancer: /api</title><path class="edge-line" d="M305.16 170.53L451.88 170.53"/><path class="arrow" d="M451.88 170.53L442.88 175.03L442.88 166.03z"/></g><g class="edge" data-id="e4" data-from="alb" data-to="app1"><title>Load balancer to App</title><path class="edge-line" d="M613.44 180.17L648.44 180.17L648.44 238.7L683.44 238.7"/><path class="arrow" d="M683.44 238.7L674.44 243.2L674.44 234.2z"/></g><g class="edge" data-id="e5" data-from="alb" data-to="app2"><title>Load balancer to App</title><path class="edge-line" d="M613.44 160.9L683.44 160.9"/><path class="arrow" d="M683.44 160.9L674.44 165.4L674.44 156.4z"/></g><g class="edge" data-id="e6" data-from="app1" data-to="db"><title>App to Orders</title><path class="edge-line" d="M816 238.7L851 238.7L851 180.17L886 180.17"/><path class="arrow" d="M886 180.17L877 184.67L877 175.67z"/></g><g class="edge" data-id="e7" data-from="app2" data-to="db"><title>App to Orders</title><path class="edge-line" d="M816 160.9L886 160.9"/><path class="arrow" d="M886 160.9L877 165.4L877 156.4z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="e2"><rect class="edge-label-box" x="324.16" y="359.5" width="58.72" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="353.52" y="369.3">/static</tspan></text></g><g class="edge-label-group" data-edge="e3"><rect class="edge-label-box" x="334.6" y="147.93" width="37.84" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="353.52" y="157.73">/api</tspan></text></g></g><g class="nodes"><g class="node type-actor role-default" id="dg-cloud-dark-n-users" data-id="users"><rect class="shape" x="0" y="141.8" width="92.96" height="70.2" rx="8"/><circle class="glyph" cx="46.48" cy="154.8" r="5.5"/><path class="glyph" d="M36.48 169.8a10 9 0 0 1 20 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="46.48" y="192.9">Visitors</tspan></text></g><g class="node type-box role-default" id="dg-cloud-dark-n-cdn" data-id="cdn"><rect class="shape" x="167.96" y="157.8" width="137.2" height="38.2" rx="8"/><g class="icon" transform="translate(181.96 166.9) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="250.56" y="176.9">CloudFront</tspan></text></g><g class="node type-box role-default" id="dg-cloud-dark-n-assets" data-id="assets"><rect class="shape" x="406.88" y="327.6" width="153.44" height="57.8" rx="8"/><g class="icon" transform="translate(420.88 346.5) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6l2 14h12l2-14"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="497.6" y="346.7">Static files</tspan></text><text class="sub" text-anchor="middle" dominant-baseline="central"><tspan x="497.6" y="367.6">S3</tspan></text></g><g class="node type-box role-default" id="dg-cloud-dark-n-alb" data-id="alb"><rect class="shape" x="451.88" y="141.63" width="161.56" height="57.8" rx="8"/><g class="icon" transform="translate(465.88 160.53) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v4M12 11 5 17M12 11l7 6"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="546.66" y="160.73">Load balancer</tspan></text><text class="sub" text-anchor="middle" dominant-baseline="central"><tspan x="546.66" y="181.63">ALB</tspan></text></g><g class="node type-box role-default" id="dg-cloud-dark-n-app1" data-id="app1"><rect class="shape" x="683.44" y="209.8" width="132.56" height="57.8" rx="8"/><g class="icon" transform="translate(697.44 228.7) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="763.72" y="228.9">App</tspan></text><text class="sub" text-anchor="middle" dominant-baseline="central"><tspan x="763.72" y="249.8">EC2, zone a</tspan></text></g><g class="node type-box role-default" id="dg-cloud-dark-n-app2" data-id="app2"><rect class="shape" x="683.44" y="132" width="132.56" height="57.8" rx="8"/><g class="icon" transform="translate(697.44 150.9) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="763.72" y="151.1">App</tspan></text><text class="sub" text-anchor="middle" dominant-baseline="central"><tspan x="763.72" y="172">EC2, zone b</tspan></text></g><g class="node type-box role-primary" id="dg-cloud-dark-n-db" data-id="db"><rect class="shape" x="886" y="141.63" width="139.52" height="57.8" rx="8"/><g class="icon" transform="translate(900 160.53) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="969.76" y="160.73">Orders</tspan></text><text class="sub" text-anchor="middle" dominant-baseline="central"><tspan x="969.76" y="181.63">RDS Postgres</tspan></text></g></g></svg>
