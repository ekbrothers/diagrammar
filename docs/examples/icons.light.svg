<svg xmlns="http://www.w3.org/2000/svg" class="dg-icons-light" viewBox="-25 -25 423.56 157.4" width="423.56" height="157.4" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-icons-light-title"><title id="dg-icons-light-title">Notification flow</title><style>.dg-icons-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-icons-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-icons-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-icons-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-icons-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-icons-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-icons-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-icons-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-icons-light text{font-family:inherit}
.dg-icons-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-icons-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-icons-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-icons-light .role-muted .shape{stroke-dasharray:5 3}
.dg-icons-light .role-primary .shape{stroke-width:2.55px}
.dg-icons-light .lbl{fill:var(--text);font-size:14px}
.dg-icons-light .card .lbl{font-weight:600}
.dg-icons-light .sub{fill:var(--text);font-size:12px}
.dg-icons-light .icon{color:var(--text)}
.dg-icons-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-icons-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-icons-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-icons-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-icons-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-icons-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-icons-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-icons-light .canvas{fill:var(--dg-bg)}
.dg-icons-light.dim .node:not(.hot),.dg-icons-light.dim .edge:not(.hot),.dg-icons-light.dim .edge-label-group:not(.hot){opacity:.3}
.dg-icons-light a{cursor:pointer}
.dg-icons-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="423.56" height="157.4" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="app" data-to="queue"><title>App to Queue</title><path class="edge-line" d="M80.36 25.47L130.36 25.47"/><path class="arrow" d="M130.36 25.47L121.36 29.97L121.36 20.97z"/></g><g class="edge" data-id="e2" data-from="queue" data-to="mail"><title>Queue to Email</title><path class="edge-line" d="M226.96 19.1L276.96 19.1"/><path class="arrow" d="M276.96 19.1L267.96 23.6L267.96 14.6z"/></g><g class="edge" data-id="e3" data-from="queue" data-to="push"><title>Queue to Push</title><path class="edge-line" d="M226.96 31.83L236.96 31.83L236.96 97.3L276.96 97.3"/><path class="arrow" d="M276.96 97.3L267.96 101.8L267.96 92.8z"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-box role-default" id="dg-icons-light-n-app" data-id="app"><rect class="shape" x="0" y="6.37" width="80.36" height="38.2" rx="8"/><g class="icon" transform="translate(14 15.47) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="54.18" y="25.47">App</tspan></text></g><g class="node type-pill role-warning" id="dg-icons-light-n-queue" data-id="queue"><rect class="shape" x="130.36" y="6.37" width="96.6" height="38.2" rx="19.1"/><g class="icon" transform="translate(144.36 15.47) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="192.66" y="25.47">Queue</tspan></text><g class="role-badge" data-role="warning" transform="translate(226.96 6.37)"><path class="badge" d="M0 -9 9 7H-9z"/><path class="glyph" d="M0 -3V1.5M0 4.3h.01"/></g></g><g class="node type-box role-default" id="dg-icons-light-n-mail" data-id="mail"><rect class="shape" x="276.96" y="0" width="96.6" height="38.2" rx="8"/><g class="icon" transform="translate(290.96 9.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="339.26" y="19.1">Email</tspan></text></g><g class="node type-box role-default" id="dg-icons-light-n-push" data-id="push"><rect class="shape" x="276.96" y="78.2" width="88.48" height="38.2" rx="8"/><g class="icon" transform="translate(290.96 87.3) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.5 4.3 4.3 0 0 1 17.5 18z"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="335.2" y="97.3">Push</tspan></text></g></g></svg>
