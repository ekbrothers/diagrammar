<svg xmlns="http://www.w3.org/2000/svg" class="dg-radial-dark" viewBox="-25 -25 320.12 284.93" width="320.12" height="284.93" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-radial-dark-title"><title id="dg-radial-dark-title">Event bus</title><style>.dg-radial-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-radial-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-radial-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-radial-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-radial-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-radial-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-radial-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-radial-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-radial-dark text{font-family:inherit}
.dg-radial-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-radial-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-radial-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-radial-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-radial-dark .role-primary .shape{stroke-width:2.55px}
.dg-radial-dark .lbl{fill:var(--text);font-size:14px}
.dg-radial-dark .card .lbl{font-weight:600}
.dg-radial-dark .sub{fill:var(--text);font-size:12px}
.dg-radial-dark .icon{color:var(--text)}
.dg-radial-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-radial-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-radial-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-radial-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-radial-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-radial-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-radial-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-radial-dark .canvas{fill:var(--dg-bg)}
.dg-radial-dark a{cursor:pointer}
.dg-radial-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="320.12" height="284.93" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="bus-orders"><title>Event bus to Orders</title><path class="edge-line" d="M170.72 144.41L206.04 170.64"/></g><g class="edge" data-id="bus-billing"><title>Event bus to Billing</title><path class="edge-line" d="M136.92 144.41L110.98 205.73"/></g><g class="edge" data-id="bus-search"><title>Event bus to Search</title><path class="edge-line" d="M94.47 117.06L76.72 114.17"/></g><g class="edge" data-id="bus-email"><title>Event bus to Email</title><path class="edge-line" d="M141.43 106.21L128.71 38.2"/></g><g class="edge" data-id="bus-audit"><title>Event bus to Audit</title><path class="edge-line" d="M173.83 106.21L206.26 84.72"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-card role-primary card" id="dg-radial-dark-n-bus" data-id="bus"><rect class="shape" x="94.47" y="106.21" width="101.08" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="145.01" y="125.31">Event bus</tspan></text></g><g class="node type-box role-default" id="dg-radial-dark-n-orders" data-id="orders"><rect class="shape" x="193.4" y="170.64" width="76.72" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="231.76" y="189.74">Orders</tspan></text></g><g class="node type-box role-default" id="dg-radial-dark-n-billing" data-id="billing"><rect class="shape" x="60.48" y="205.73" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="102.9" y="224.83">Billing</tspan></text></g><g class="node type-box role-default" id="dg-radial-dark-n-search" data-id="search"><rect class="shape" x="0" y="88.81" width="76.72" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="38.36" y="107.91">Search</tspan></text></g><g class="node type-box role-default" id="dg-radial-dark-n-email" data-id="email"><rect class="shape" x="90.84" y="0" width="68.6" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="125.14" y="19.1">Email</tspan></text></g><g class="node type-box role-muted" id="dg-radial-dark-n-audit" data-id="audit"><rect class="shape" x="200.78" y="46.52" width="68.6" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="235.08" y="65.62">Audit</tspan></text></g></g></svg>
