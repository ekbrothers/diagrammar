<svg xmlns="http://www.w3.org/2000/svg" class="dg-theme-dark" viewBox="-25 -25 477.92 79.2" width="477.92" height="79.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-theme-dark-title"><title id="dg-theme-dark-title">Custom theme and per-node colors</title><style>.dg-theme-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#2e1065;--dg-primary-stroke:#a78bfa;--dg-primary-text:#ede9fe;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-theme-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-theme-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-theme-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-theme-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-theme-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-theme-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-theme-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-theme-dark text{font-family:inherit}
.dg-theme-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-theme-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-theme-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-theme-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-theme-dark .role-primary .shape{stroke-width:2.55px}
.dg-theme-dark .lbl{fill:var(--text);font-size:14px}
.dg-theme-dark .card .lbl{font-weight:600}
.dg-theme-dark .sub{fill:var(--text);font-size:12px}
.dg-theme-dark .icon{color:var(--text)}
.dg-theme-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-theme-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-theme-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-theme-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-theme-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-theme-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-theme-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-theme-dark .canvas{fill:var(--dg-bg)}
.dg-theme-dark a{cursor:pointer}
.dg-theme-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="477.92" height="79.2" rx="14"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1"><title>Brief to Design</title><path class="edge-line" d="M68.6 19.1L118.6 19.1"/><path class="arrow" d="M118.6 19.1L109.6 23.6L109.6 14.6z"/></g><g class="edge" data-id="e2"><title>Design to Build</title><path class="edge-line" d="M195.32 19.1L245.32 19.1"/><path class="arrow" d="M245.32 19.1L236.32 23.6L236.32 14.6z"/></g><g class="edge" data-id="e3"><title>Build to Ship</title><path class="edge-line" d="M313.92 19.1L363.92 19.1"/><path class="arrow" d="M363.92 19.1L354.92 23.6L354.92 14.6z"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-card role-primary card" id="dg-theme-dark-n-brief" data-id="brief"><rect class="shape" x="0" y="0" width="68.6" height="38.2" rx="14"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="34.3" y="19.1">Brief</tspan></text></g><g class="node type-box role-default" id="dg-theme-dark-n-design" data-id="design"><rect class="shape" x="118.6" y="0" width="76.72" height="38.2" rx="14"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="156.96" y="19.1">Design</tspan></text></g><g class="node type-box role-default" id="dg-theme-dark-n-build" data-id="build" style="--fill:#be185d;--stroke:#9d174d;--text:#ffffff"><rect class="shape" x="245.32" y="0" width="68.6" height="38.2" rx="14"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="279.62" y="19.1">Build</tspan></text></g><g class="node type-box role-success" id="dg-theme-dark-n-ship" data-id="ship"><rect class="shape" x="363.92" y="0" width="64" height="38.2" rx="14"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="395.92" y="19.1">Ship</tspan></text><g class="role-badge" data-role="success" transform="translate(427.92 0)"><circle class="badge" r="8"/><path class="glyph" d="M-3.5 0.5 -1 3 3.5 -2.5"/></g></g></g></svg>
