<svg xmlns="http://www.w3.org/2000/svg" class="dg-layers-light" viewBox="-16 -16 321.56 569.4" width="321.56" height="569.4" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-layers-light-title"><title id="dg-layers-light-title">Services and a hidden migration layer</title><style>.dg-layers-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-layers-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-layers-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-layers-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-layers-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-layers-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-layers-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-layers-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-layers-light text{font-family:inherit}
.dg-layers-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-layers-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-layers-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-layers-light .role-muted .shape{stroke-dasharray:5 3}
.dg-layers-light .role-primary .shape{stroke-width:2.55px}
.dg-layers-light .lbl{fill:var(--text);font-size:14px}
.dg-layers-light .card .lbl{font-weight:600}
.dg-layers-light .sub{fill:var(--text);font-size:12px}
.dg-layers-light .icon{color:var(--text)}
.dg-layers-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-layers-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-layers-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-layers-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-layers-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-layers-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-layers-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-layers-light .canvas{fill:var(--dg-bg)}
.dg-layers-light a{cursor:pointer}
.dg-layers-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-16" y="-16" width="321.56" height="569.4" rx="8"/><g class="groups"><g class="group" id="dg-layers-light-g-frontend" data-id="frontend"><rect class="group-box" x="43.75" y="0" width="120.36" height="102.2" rx="8"/><text class="group-label" x="53.75" y="15" dominant-baseline="central">Frontend</text></g><g class="group" id="dg-layers-light-g-services" data-id="services"><rect class="group-box" x="0" y="162.2" width="289.56" height="375.2" rx="8"/><text class="group-label" x="10" y="177.2" dominant-baseline="central">Services</text></g><g class="group" id="dg-layers-light-g-data" data-id="data"><rect class="group-box" x="20" y="269.4" width="141.08" height="248" rx="8"/><text class="group-label" x="30" y="284.4" dominant-baseline="central">Data</text></g></g><g class="edges"><g class="edge" data-id="e1"><title>Web to API</title><path class="edge-line" d="M103.93 82.2L103.93 206.2"/><path class="arrow" d="M103.93 206.2L99.43 197.2L108.43 197.2z"/></g><g class="edge" data-id="e2"><title>API to Auth</title><path class="edge-line" d="M117.33 244.4L117.33 254.4L225.32 254.4L225.32 269.4"/><path class="arrow" d="M225.32 269.4L220.82 260.4L229.82 260.4z"/></g><g class="edge" data-id="e3"><title>API to Orders</title><path class="edge-line" d="M90.54 244.4L90.54 313.4"/><path class="arrow" d="M90.54 313.4L86.04 304.4L95.04 304.4z"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-box role-default" id="dg-layers-light-n-web" data-id="web"><rect class="shape" x="63.75" y="44" width="80.36" height="38.2" rx="8"/><g class="icon" transform="translate(77.75 53.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="117.93" y="63.1">Web</tspan></text></g><g class="node type-box role-primary" id="dg-layers-light-n-api" data-id="api"><rect class="shape" x="63.75" y="206.2" width="80.36" height="38.2" rx="8"/><g class="icon" transform="translate(77.75 215.3) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="117.93" y="225.3">API</tspan></text></g><g class="node type-box role-default" id="dg-layers-light-n-auth" data-id="auth"><rect class="shape" x="181.08" y="269.4" width="88.48" height="38.2" rx="8"/><g class="icon" transform="translate(195.08 278.5) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="239.32" y="288.5">Auth</tspan></text></g><g class="node type-database role-default" id="dg-layers-light-n-db" data-id="db"><path class="shape" d="M52.18 321.4a38.36 8 0 0 1 76.72 0v46.2a38.36 8 0 0 1 -76.72 0z"/><path class="glyph" d="M52.18 321.4a38.36 8 0 0 0 76.72 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="90.54" y="348.5">Orders</tspan></text></g></g></svg>
