<svg xmlns="http://www.w3.org/2000/svg" class="dg-theme-light" viewBox="-25 -25 477.92 79.2" width="477.92" height="79.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-theme-light-title"><title id="dg-theme-light-title">Custom theme and per-node colors</title><style>.dg-theme-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ede9fe;--dg-primary-stroke:#6d28d9;--dg-primary-text:#2e1065;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-theme-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-theme-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-theme-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-theme-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-theme-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-theme-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-theme-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-theme-light text{font-family:inherit}
.dg-theme-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-theme-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-theme-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-theme-light .role-muted .shape{stroke-dasharray:5 3}
.dg-theme-light .role-primary .shape{stroke-width:2.55px}
.dg-theme-light .lbl{fill:var(--text);font-size:14px}
.dg-theme-light .card .lbl{font-weight:600}
.dg-theme-light .sub{fill:var(--text);font-size:12px}
.dg-theme-light .icon{color:var(--text)}
.dg-theme-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-theme-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-theme-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-theme-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-theme-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-theme-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-theme-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-theme-light .canvas{fill:var(--dg-bg)}
.dg-theme-light.dim .node:not(.hot),.dg-theme-light.dim .edge:not(.hot),.dg-theme-light.dim .edge-label-group:not(.hot){opacity:.3}
.dg-theme-light a{cursor:pointer}
.dg-theme-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="477.92" height="79.2" rx="14"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="brief" data-to="design"><title>Brief to Design</title><path class="edge-line" d="M68.6 19.1L118.6 19.1"/><path class="arrow" d="M118.6 19.1L109.6 23.6L109.6 14.6z"/></g><g class="edge" data-id="e2" data-from="design" data-to="build"><title>Design to Build</title><path class="edge-line" d="M195.32 19.1L245.32 19.1"/><path class="arrow" d="M245.32 19.1L236.32 23.6L236.32 14.6z"/></g><g class="edge" data-id="e3" data-from="build" data-to="ship"><title>Build to Ship</title><path class="edge-line" d="M313.92 19.1L363.92 19.1"/><path class="arrow" d="M363.92 19.1L354.92 23.6L354.92 14.6z"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-card role-primary card" id="dg-theme-light-n-brief" data-id="brief"><rect class="shape" x="0" y="0" width="68.6" height="38.2" rx="14"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="34.3" y="19.1">Brief</tspan></text></g><g class="node type-box role-default" id="dg-theme-light-n-design" data-id="design"><rect class="shape" x="118.6" y="0" width="76.72" height="38.2" rx="14"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="156.96" y="19.1">Design</tspan></text></g><g class="node type-box role-default" id="dg-theme-light-n-build" data-id="build" style="--fill:#be185d;--stroke:#9d174d;--text:#ffffff"><rect class="shape" x="245.32" y="0" width="68.6" height="38.2" rx="14"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="279.62" y="19.1">Build</tspan></text></g><g class="node type-box role-success" id="dg-theme-light-n-ship" data-id="ship"><rect class="shape" x="363.92" y="0" width="64" height="38.2" rx="14"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="395.92" y="19.1">Ship</tspan></text><g class="role-badge" data-role="success" transform="translate(427.92 0)"><circle class="badge" r="8"/><path class="glyph" d="M-3.5 0.5 -1 3 3.5 -2.5"/></g></g></g></svg>
