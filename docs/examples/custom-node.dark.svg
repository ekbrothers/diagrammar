<svg xmlns="http://www.w3.org/2000/svg" class="dg-custom-node-dark" viewBox="-25 -25 558.28 79.2" width="558.28" height="79.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-custom-node-dark-title"><title id="dg-custom-node-dark-title">Custom node type</title><style>.dg-custom-node-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-custom-node-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-custom-node-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-custom-node-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-custom-node-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-custom-node-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-custom-node-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-custom-node-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-custom-node-dark text{font-family:inherit}
.dg-custom-node-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-custom-node-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-custom-node-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-custom-node-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-custom-node-dark .role-primary .shape{stroke-width:2.55px}
.dg-custom-node-dark .lbl{fill:var(--text);font-size:14px}
.dg-custom-node-dark .card .lbl{font-weight:600}
.dg-custom-node-dark .sub{fill:var(--text);font-size:12px}
.dg-custom-node-dark .icon{color:var(--text)}
.dg-custom-node-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-custom-node-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-custom-node-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-custom-node-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-custom-node-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-custom-node-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-custom-node-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-custom-node-dark .canvas{fill:var(--dg-bg)}
.dg-custom-node-dark.dim .node:not(.hot),.dg-custom-node-dark.dim .edge:not(.hot),.dg-custom-node-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-custom-node-dark a{cursor:pointer}
.dg-custom-node-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="558.28" height="79.2" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="pr" data-to="entry"><title>Pull request to Changelog entry</title><path class="edge-line" d="M153.44 19.1L203.44 19.1"/><path class="arrow" d="M203.44 19.1L194.44 23.6L194.44 14.6z"/></g><g class="edge" data-id="e2" data-from="entry" data-to="release"><title>Changelog entry to Release</title><path class="edge-line" d="M373.44 19.1L423.44 19.1"/><path class="arrow" d="M423.44 19.1L414.44 23.6L414.44 14.6z"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-box role-default" id="dg-custom-node-dark-n-pr" data-id="pr"><rect class="shape" x="0" y="0" width="153.44" height="38.2" rx="8"/><g class="icon" transform="translate(14 9.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="90.72" y="19.1">Pull request</tspan></text></g><g class="node type-note role-default" id="dg-custom-node-dark-n-entry" data-id="entry"><path class="shape" d="M203.44 0H359.44L373.44 14V38.2H203.44Z"/><path class="glyph" d="M359.44 0V14H373.44"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="288.44" y="19.1">Changelog entry</tspan></text></g><g class="node type-box role-success" id="dg-custom-node-dark-n-release" data-id="release"><rect class="shape" x="423.44" y="0" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="465.86" y="19.1">Release</tspan></text><g class="role-badge" data-role="success" transform="translate(508.28 0)"><circle class="badge" r="8"/><path class="glyph" d="M-3.5 0.5 -1 3 3.5 -2.5"/></g></g></g></svg>
