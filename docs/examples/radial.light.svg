<svg xmlns="http://www.w3.org/2000/svg" class="dg-radial-light" viewBox="-25 -25 320.12 284.93" width="320.12" height="284.93" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-radial-light-title"><title id="dg-radial-light-title">Event bus</title><style>.dg-radial-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-radial-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-radial-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-radial-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-radial-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-radial-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-radial-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-radial-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-radial-light text{font-family:inherit}
.dg-radial-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-radial-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-radial-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-radial-light .role-muted .shape{stroke-dasharray:5 3}
.dg-radial-light .role-primary .shape{stroke-width:2.55px}
.dg-radial-light .lbl{fill:var(--text);font-size:14px}
.dg-radial-light .card .lbl{font-weight:600}
.dg-radial-light .sub{fill:var(--text);font-size:12px}
.dg-radial-light .icon{color:var(--text)}
.dg-radial-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-radial-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-radial-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-radial-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-radial-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-radial-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-radial-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-radial-light .canvas{fill:var(--dg-bg)}
.dg-radial-light.dim .node:not(.hot),.dg-radial-light.dim .edge:not(.hot),.dg-radial-light.dim .edge-label-group:not(.hot){opacity:.3}
.dg-radial-light a{cursor:pointer}
.dg-radial-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="320.12" height="284.93" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="bus-orders" data-from="bus" data-to="orders"><title>Event bus to Orders</title><path class="edge-line" d="M170.72 144.41L206.04 170.64"/></g><g class="edge" data-id="bus-billing" data-from="bus" data-to="billing"><title>Event bus to Billing</title><path class="edge-line" d="M136.92 144.41L110.98 205.73"/></g><g class="edge" data-id="bus-search" data-from="bus" data-to="search"><title>Event bus to Search</title><path class="edge-line" d="M94.47 117.06L76.72 114.17"/></g><g class="edge" data-id="bus-email" data-from="bus" data-to="email"><title>Event bus to Email</title><path class="edge-line" d="M141.43 106.21L128.71 38.2"/></g><g class="edge" data-id="bus-audit" data-from="bus" data-to="audit"><title>Event bus to Audit</title><path class="edge-line" d="M173.83 106.21L206.26 84.72"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-card role-primary card" id="dg-radial-light-n-bus" data-id="bus"><rect class="shape" x="94.47" y="106.21" width="101.08" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="145.01" y="125.31">Event bus</tspan></text></g><g class="node type-box role-default" id="dg-radial-light-n-orders" data-id="orders"><rect class="shape" x="193.4" y="170.64" width="76.72" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="231.76" y="189.74">Orders</tspan></text></g><g class="node type-box role-default" id="dg-radial-light-n-billing" data-id="billing"><rect class="shape" x="60.48" y="205.73" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="102.9" y="224.83">Billing</tspan></text></g><g class="node type-box role-default" id="dg-radial-light-n-search" data-id="search"><rect class="shape" x="0" y="88.81" width="76.72" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="38.36" y="107.91">Search</tspan></text></g><g class="node type-box role-default" id="dg-radial-light-n-email" data-id="email"><rect class="shape" x="90.84" y="0" width="68.6" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="125.14" y="19.1">Email</tspan></text></g><g class="node type-box role-muted" id="dg-radial-light-n-audit" data-id="audit"><rect class="shape" x="200.78" y="46.52" width="68.6" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="235.08" y="65.62">Audit</tspan></text></g></g></svg>
