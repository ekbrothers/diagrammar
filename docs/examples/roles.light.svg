<svg xmlns="http://www.w3.org/2000/svg" class="dg-roles-light" viewBox="-25 -25 425.12 317.3" width="425.12" height="317.3" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-roles-light-title"><title id="dg-roles-light-title">Roles and edge styles</title><style>.dg-roles-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-roles-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-roles-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-roles-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-roles-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-roles-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-roles-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-roles-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-roles-light text{font-family:inherit}
.dg-roles-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-roles-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-roles-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-roles-light .role-muted .shape{stroke-dasharray:5 3}
.dg-roles-light .role-primary .shape{stroke-width:2.55px}
.dg-roles-light .lbl{fill:var(--text);font-size:14px}
.dg-roles-light .card .lbl{font-weight:600}
.dg-roles-light .sub{fill:var(--text);font-size:12px}
.dg-roles-light .icon{color:var(--text)}
.dg-roles-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-roles-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-roles-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-roles-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-roles-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-roles-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-roles-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-roles-light .canvas{fill:var(--dg-bg)}
.dg-roles-light.dim .node:not(.hot),.dg-roles-light.dim .edge:not(.hot),.dg-roles-light.dim .edge-label-group:not(.hot){opacity:.3}
.dg-roles-light a{cursor:pointer}
.dg-roles-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="425.12" height="317.3" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="a" data-from="source" data-to="ok"><title>Primary to Healthy: solid</title><path class="edge-line" d="M118.48 242.14L148.48 242.14L148.48 175.5L282.16 175.5"/><path class="arrow" d="M282.16 175.5L273.16 180L273.16 171z"/></g><g class="edge" data-id="b" data-from="source" data-to="slow"><title>Primary to Degraded: dashed</title><path class="edge-line" stroke-dasharray="6 4" d="M118.48 253.7L282.16 253.7"/><path class="arrow" d="M282.16 253.7L273.16 258.2L273.16 249.2z"/></g><g class="edge role-danger" data-id="c" data-from="source" data-to="down"><title>Primary to Failing: dotted</title><path class="edge-line" stroke-dasharray="0.1 5" d="M118.48 219.02L128.48 219.02L128.48 19.1L282.16 19.1"/><path class="arrow" d="M282.16 19.1L273.16 23.6L273.16 14.6z"/></g><g class="edge" data-id="d" data-from="source" data-to="off"><title>Primary to Retired: no arrow</title><path class="edge-line" d="M118.48 230.58L138.48 230.58L138.48 97.3L282.16 97.3"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="a"><rect class="edge-label-box" x="177.92" y="178.5" width="44.8" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="200.32" y="188.3">solid</tspan></text></g><g class="edge-label-group" data-edge="b"><rect class="edge-label-box" x="174.44" y="256.7" width="51.76" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="200.32" y="266.5">dashed</tspan></text></g><g class="edge-label-group" data-edge="c"><rect class="edge-label-box" x="174.44" y="22.1" width="51.76" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="200.32" y="31.9">dotted</tspan></text></g><g class="edge-label-group" data-edge="d"><rect class="edge-label-box" x="167.48" y="100.3" width="65.68" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="200.32" y="110.1">no arrow</tspan></text></g></g><g class="nodes"><g class="node type-card role-primary card" id="dg-roles-light-n-source" data-id="source"><rect class="shape" x="0" y="207.46" width="118.48" height="57.8" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="59.24" y="226.56">Primary</tspan></text><text class="sub" text-anchor="middle" dominant-baseline="central"><tspan x="59.24" y="247.46">The main path</tspan></text></g><g class="node type-box role-success" id="dg-roles-light-n-ok" data-id="ok"><rect class="shape" x="282.16" y="156.4" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="324.58" y="175.5">Healthy</tspan></text><g class="role-badge" data-role="success" transform="translate(367 156.4)"><circle class="badge" r="8"/><path class="glyph" d="M-3.5 0.5 -1 3 3.5 -2.5"/></g></g><g class="node type-box role-warning" id="dg-roles-light-n-slow" data-id="slow"><rect class="shape" x="282.16" y="234.6" width="92.96" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="328.64" y="253.7">Degraded</tspan></text><g class="role-badge" data-role="warning" transform="translate(375.12 234.6)"><path class="badge" d="M0 -9 9 7H-9z"/><path class="glyph" d="M0 -3V1.5M0 4.3h.01"/></g></g><g class="node type-box role-danger" id="dg-roles-light-n-down" data-id="down"><rect class="shape" x="282.16" y="0" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="324.58" y="19.1">Failing</tspan></text><g class="role-badge" data-role="danger" transform="translate(367 0)"><rect class="badge" x="-6.5" y="-6.5" width="13" height="13" rx="2" transform="rotate(45)"/><path class="glyph" d="M-2.8 -2.8 2.8 2.8M2.8 -2.8-2.8 2.8"/></g></g><g class="node type-box role-muted" id="dg-roles-light-n-off" data-id="off"><rect class="shape" x="282.16" y="78.2" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="324.58" y="97.3">Retired</tspan></text></g></g></svg>
