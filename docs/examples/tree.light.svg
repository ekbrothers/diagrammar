<svg xmlns="http://www.w3.org/2000/svg" class="dg-tree-light" viewBox="-25 -25 432.6 235.2" width="432.6" height="235.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-tree-light-title"><title id="dg-tree-light-title">Org chart</title><style>.dg-tree-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-tree-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-tree-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-tree-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-tree-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-tree-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-tree-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-tree-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-tree-light text{font-family:inherit}
.dg-tree-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-tree-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-tree-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-tree-light .role-muted .shape{stroke-dasharray:5 3}
.dg-tree-light .role-primary .shape{stroke-width:2.55px}
.dg-tree-light .lbl{fill:var(--text);font-size:14px}
.dg-tree-light .card .lbl{font-weight:600}
.dg-tree-light .sub{fill:var(--text);font-size:12px}
.dg-tree-light .icon{color:var(--text)}
.dg-tree-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-tree-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-tree-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-tree-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-tree-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-tree-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-tree-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-tree-light .canvas{fill:var(--dg-bg)}
.dg-tree-light a{cursor:pointer}
.dg-tree-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="432.6" height="235.2" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1"><title>CEO to Engineering</title><path class="edge-line" d="M205.33 38.2L205.33 58.2L106.5 76.68L103 78"/></g><g class="edge" data-id="e2"><title>CEO to Operations</title><path class="edge-line" d="M226.67 38.2L226.67 58.2L324.5 76.68L328 78"/></g><g class="edge" data-id="e3"><title>Engineering to Web</title><path class="edge-line" d="M83.45 116.2L83.45 136.2L35.5 154.68L32 156"/></g><g class="edge" data-id="e4"><title>Engineering to Infrastructure</title><path class="edge-line" d="M122.55 116.2L122.55 136.2L171.5 154.68L175 156"/></g><g class="edge" data-id="e5"><title>Operations to Support</title><path class="edge-line" d="M328 116.2L328 136.2L328 156"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-card role-primary card" id="dg-tree-light-n-ceo" data-id="ceo"><rect class="shape" x="184" y="0" width="64" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="216" y="19.1">CEO</tspan></text></g><g class="node type-box role-default" id="dg-tree-light-n-eng" data-id="eng"><rect class="shape" x="44.34" y="78" width="117.32" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="103" y="97.1">Engineering</tspan></text></g><g class="node type-box role-default" id="dg-tree-light-n-ops" data-id="ops"><rect class="shape" x="273.4" y="78" width="109.2" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="328" y="97.1">Operations</tspan></text></g><g class="node type-box role-muted" id="dg-tree-light-n-web" data-id="web"><rect class="shape" x="0" y="156" width="64" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="32" y="175.1">Web</tspan></text></g><g class="node type-box role-muted" id="dg-tree-light-n-infra" data-id="infra"><rect class="shape" x="104.16" y="156" width="141.68" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="175" y="175.1">Infrastructure</tspan></text></g><g class="node type-box role-muted" id="dg-tree-light-n-support" data-id="support"><rect class="shape" x="285.58" y="156" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="328" y="175.1">Support</tspan></text></g></g></svg>
