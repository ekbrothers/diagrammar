<svg xmlns="http://www.w3.org/2000/svg" class="dg-react-light" viewBox="-25 -16 784.92 158.2" width="784.92" height="158.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-react-light-title"><title id="dg-react-light-title">Web application</title><style>.dg-react-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-react-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-react-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-react-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-react-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-react-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-react-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-react-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-react-light text{font-family:inherit}
.dg-react-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-react-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-react-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-react-light .role-muted .shape{stroke-dasharray:5 3}
.dg-react-light .role-primary .shape{stroke-width:2.55px}
.dg-react-light .lbl{fill:var(--text);font-size:14px}
.dg-react-light .card .lbl{font-weight:600}
.dg-react-light .sub{fill:var(--text);font-size:12px}
.dg-react-light .icon{color:var(--text)}
.dg-react-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-react-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-react-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-react-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-react-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-react-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-react-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-react-light .canvas{fill:var(--dg-bg)}
.dg-react-light.dim .node:not(.hot),.dg-react-light.dim .edge:not(.hot),.dg-react-light.dim .edge-label-group:not(.hot){opacity:.3}
.dg-react-light a{cursor:pointer}
.dg-react-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-16" width="784.92" height="158.2" rx="8"/><g class="groups"><g class="group" id="dg-react-light-g-edge" data-id="edge"><rect class="group-box" x="224.52" y="12" width="120.36" height="102.2" rx="8"/><text class="group-label" x="234.52" y="27" dominant-baseline="central">Edge</text></g><g class="group" id="dg-react-light-g-backend" data-id="backend"><rect class="group-box" x="404.88" y="0" width="339.04" height="126.2" rx="8"/><text class="group-label" x="414.88" y="15" dominant-baseline="central">Backend</text></g></g><g class="edges"><g class="edge" data-id="reader-&gt;cdn" data-from="reader" data-to="cdn"><title>Reader to CDN: HTTPS</title><path class="edge-line" d="M76.72 75.1L244.52 75.1"/><path class="arrow" d="M244.52 75.1L235.52 79.6L235.52 70.6z"/></g><g class="edge" data-id="cdn-&gt;app" data-from="cdn" data-to="app"><title>CDN to App server</title><path class="edge-line" d="M324.88 75.1L424.88 75.1"/><path class="arrow" d="M424.88 75.1L415.88 79.6L415.88 70.6z"/></g><g class="edge" data-id="app-&gt;db" data-from="app" data-to="db"><title>App server to Postgres: SQL</title><path class="edge-line" d="M562.08 75.1L630.96 75.1"/><path class="arrow" d="M630.96 75.1L621.96 79.6L621.96 70.6z"/><path class="arrow" d="M562.08 75.1L571.08 70.6L571.08 79.6z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="reader-&gt;cdn"><rect class="edge-label-box" x="125.72" y="78.1" width="44.8" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="148.12" y="87.9">HTTPS</tspan></text></g><g class="edge-label-group" data-edge="app-&gt;db"><rect class="edge-label-box" x="581.08" y="78.1" width="30.88" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="596.52" y="87.9">SQL</tspan></text></g></g><g class="nodes"><g class="node type-actor role-default" id="dg-react-light-n-reader" data-id="reader"><rect class="shape" x="0" y="40" width="76.72" height="70.2" rx="8"/><circle class="glyph" cx="38.36" cy="53" r="5.5"/><path class="glyph" d="M28.36 68a10 9 0 0 1 20 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="38.36" y="91.1">Reader</tspan></text></g><g class="node type-pill role-default" id="dg-react-light-n-cdn" data-id="cdn"><rect class="shape" x="244.52" y="56" width="80.36" height="38.2" rx="19.1"/><g class="icon" transform="translate(258.52 65.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.5 4.3 4.3 0 0 1 17.5 18z"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="298.7" y="75.1">CDN</tspan></text></g><g class="node type-card role-primary card" id="dg-react-light-n-app" data-id="app"><rect class="shape" x="424.88" y="46.2" width="137.2" height="57.8" rx="8"/><g class="icon" transform="translate(438.88 65.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="507.48" y="65.3">App server</tspan></text><text class="sub" text-anchor="middle" dominant-baseline="central"><tspan x="507.48" y="86.2">Next.js</tspan></text></g><g class="node type-database role-default" id="dg-react-light-n-db" data-id="db"><path class="shape" d="M630.96 52a46.48 8 0 0 1 92.96 0v46.2a46.48 8 0 0 1 -92.96 0z"/><path class="glyph" d="M630.96 52a46.48 8 0 0 0 92.96 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="677.44" y="79.1">Postgres</tspan></text></g></g></svg>
