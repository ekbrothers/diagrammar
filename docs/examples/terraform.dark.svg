<svg xmlns="http://www.w3.org/2000/svg" class="dg-terraform-dark" viewBox="-25 -16 1768.9 161.87" width="1768.9" height="161.87" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-terraform-dark-title dg-terraform-dark-desc"><title id="dg-terraform-dark-title">A Terraform run</title><desc id="dg-terraform-dark-desc">A change is pushed to GitHub, which starts a CI run. the workspace produces a plan, waits for approval, then applies it to the Snowflake warehouse and updates the state file.</desc><style>.dg-terraform-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-terraform-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-terraform-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-terraform-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-terraform-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-terraform-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-terraform-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-terraform-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-terraform-dark text{font-family:inherit}
.dg-terraform-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-terraform-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-terraform-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-terraform-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-terraform-dark .role-primary .shape{stroke-width:2.55px}
.dg-terraform-dark .lbl{fill:var(--text);font-size:14px}
.dg-terraform-dark .card .lbl{font-weight:600}
.dg-terraform-dark .sub{fill:var(--text);font-size:12px}
.dg-terraform-dark .icon{color:var(--text)}
.dg-terraform-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-terraform-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-terraform-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-terraform-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-terraform-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-terraform-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-terraform-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-terraform-dark .canvas{fill:var(--dg-bg)}
.dg-terraform-dark.dim .node:not(.hot),.dg-terraform-dark.dim .edge:not(.hot),.dg-terraform-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-terraform-dark a{cursor:pointer}
