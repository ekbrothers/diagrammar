<svg xmlns="http://www.w3.org/2000/svg" class="dg-quickstart-light" viewBox="-25 -25 1010.48 111.2" width="1010.48" height="111.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-quickstart-light-title dg-quickstart-light-desc"><title id="dg-quickstart-light-title">Release pipeline</title><desc id="dg-quickstart-light-desc">A change moves from a developer through CI to the package registry.</desc><style>.dg-quickstart-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-quickstart-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-quickstart-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-quickstart-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-quickstart-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-quickstart-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-quickstart-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-quickstart-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-quickstart-light text{font-family:inherit}
.dg-quickstart-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-quickstart-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-quickstart-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-quickstart-light .role-muted .shape{stroke-dasharray:5 3}
.dg-quickstart-light .role-primary .shape{stroke-width:2.55px}
.dg-quickstart-light .lbl{fill:var(--text);font-size:14px}
.dg-quickstart-light .card .lbl{font-weight:600}
.dg-quickstart-light .sub{fill:var(--text);font-size:12px}
.dg-quickstart-light .icon{color:var(--text)}
.dg-quickstart-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-quickstart-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-quickstart-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-quickstart-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-quickstart-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-quickstart-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-quickstart-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-quickstart-light .canvas{fill:var(--dg-bg)}
.dg-quickstart-light.dim .node:not(.hot),.dg-quickstart-light.dim .edge:not(.hot),.dg-quickstart-light.dim .edge-label-group:not(.hot){opacity:.3}
.dg-quickstart-light a{cursor:pointer}
.dg-quickstart-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="1010.48" height="111.2" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="push" data-from="dev" data-to="ci"><title>Developer to CI: git push</title><path class="edge-line" d="M101.08 35.1L264.76 35.1"/><path class="arrow" d="M264.76 35.1L255.76 39.6L255.76 30.6z"/></g><g class="edge" data-id="pass" data-from="ci" data-to="build"><title>CI to Build: green</title><path class="edge-line" d="M466.92 35.1L609.72 35.1"/><path class="arrow" d="M609.72 35.1L600.72 39.6L600.72 30.6z"/></g><g class="edge" data-id="publish" data-from="build" data-to="registry"><title>Build to npm registry: publish</title><path class="edge-line" d="M678.32 35.1L835.04 35.1"/><path class="arrow" d="M835.04 35.1L826.04 39.6L826.04 30.6z"/></g></g><g class="edge-labels"><g class="edge-label-group" data-edge="push"><rect class="edge-label-box" x="150.08" y="38.1" width="65.68" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="182.92" y="47.9">git push</tspan></text></g><g class="edge-label-group" data-edge="pass"><rect class="edge-label-box" x="515.92" y="38.1" width="44.8" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="538.32" y="47.9">green</tspan></text></g><g class="edge-label-group" data-edge="publish"><rect class="edge-label-box" x="727.32" y="38.1" width="58.72" height="19.6" rx="3"/><text class="edge-label" text-anchor="middle" dominant-baseline="central"><tspan x="756.68" y="47.9">publish</tspan></text></g></g><g class="nodes"><g class="node type-actor role-default" id="dg-quickstart-light-n-dev" data-id="dev"><rect class="shape" x="0" y="0" width="101.08" height="70.2" rx="8"/><circle class="glyph" cx="50.54" cy="13" r="5.5"/><path class="glyph" d="M40.54 28a10 9 0 0 1 20 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="50.54" y="51.1">Developer</tspan></text></g><g class="node type-card role-primary card" id="dg-quickstart-light-n-ci" data-id="ci"><rect class="shape" x="264.76" y="6.2" width="202.16" height="57.8" rx="8"/><g class="icon" transform="translate(278.76 25.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="379.84" y="25.3">CI</tspan></text><text class="sub" text-anchor="middle" dominant-baseline="central"><tspan x="379.84" y="46.2">Typecheck, lint, test</tspan></text></g><g class="node type-box role-default" id="dg-quickstart-light-n-build" data-id="build"><rect class="shape" x="609.72" y="16" width="68.6" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="644.02" y="35.1">Build</tspan></text></g><g class="node type-database role-success" id="dg-quickstart-light-n-registry" data-id="registry"><path class="shape" d="M835.04 12a62.72 8 0 0 1 125.44 0v46.2a62.72 8 0 0 1 -125.44 0z"/><path class="glyph" d="M835.04 12a62.72 8 0 0 0 125.44 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="897.76" y="39.1">npm registry</tspan></text><g class="role-badge" data-role="success" transform="translate(960.48 4)"><circle class="badge" r="8"/><path class="glyph" d="M-3.5 0.5 -1 3 3.5 -2.5"/></g></g></g></svg>
