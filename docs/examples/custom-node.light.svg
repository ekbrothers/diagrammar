<svg xmlns="http://www.w3.org/2000/svg" class="dg-custom-node-light" viewBox="-25 -25 558.28 79.2" width="558.28" height="79.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-custom-node-light-title"><title id="dg-custom-node-light-title">Custom node type</title><style>.dg-custom-node-light{--dg-bg:#ffffff;--dg-text:#1f2328;--dg-text-muted:#57606a;--dg-edge:#57606a;--dg-group-fill:#f6f8fa;--dg-group-stroke:#6e7781;--dg-default-fill:#ffffff;--dg-default-stroke:#6e7781;--dg-default-text:#1f2328;--dg-primary-fill:#ddf4ff;--dg-primary-stroke:#0969da;--dg-primary-text:#0a3069;--dg-success-fill:#dafbe1;--dg-success-stroke:#1a7f37;--dg-success-text:#0f5323;--dg-warning-fill:#fff8c5;--dg-warning-stroke:#9a6700;--dg-warning-text:#4d2d00;--dg-danger-fill:#ffebe9;--dg-danger-stroke:#cf222e;--dg-danger-text:#82071e;--dg-muted-fill:#f6f8fa;--dg-muted-stroke:#6e7781;--dg-muted-text:#57606a}
.dg-custom-node-light{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-custom-node-light .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-custom-node-light .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-custom-node-light .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-custom-node-light .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-custom-node-light .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-custom-node-light .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-custom-node-light text{font-family:inherit}
.dg-custom-node-light .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-custom-node-light .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-custom-node-light .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-custom-node-light .role-muted .shape{stroke-dasharray:5 3}
.dg-custom-node-light .role-primary .shape{stroke-width:2.55px}
.dg-custom-node-light .lbl{fill:var(--text);font-size:14px}
.dg-custom-node-light .card .lbl{font-weight:600}
.dg-custom-node-light .sub{fill:var(--text);font-size:12px}
.dg-custom-node-light .icon{color:var(--text)}
.dg-custom-node-light .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-custom-node-light .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-custom-node-light .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-custom-node-light .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-custom-node-light .edge-label{fill:var(--dg-text);font-size:12px}
.dg-custom-node-light .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-custom-node-light .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-custom-node-light .canvas{fill:var(--dg-bg)}
.dg-custom-node-light a{cursor:pointer}
.dg-custom-node-light a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="558.28" height="79.2" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1"><title>Pull request to Changelog entry</title><path class="edge-line" d="M153.44 19.1L203.44 19.1"/><path class="arrow" d="M203.44 19.1L194.44 23.6L194.44 14.6z"/></g><g class="edge" data-id="e2"><title>Changelog entry to Release</title><path class="edge-line" d="M373.44 19.1L423.44 19.1"/><path class="arrow" d="M423.44 19.1L414.44 23.6L414.44 14.6z"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-box role-default" id="dg-custom-node-light-n-pr" data-id="pr"><rect class="shape" x="0" y="0" width="153.44" height="38.2" rx="8"/><g class="icon" transform="translate(14 9.1) scale(0.83) translate(0 0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></g><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="90.72" y="19.1">Pull request</tspan></text></g><g class="node type-note role-default" id="dg-custom-node-light-n-entry" data-id="entry"><path class="shape" d="M203.44 0H359.44L373.44 14V38.2H203.44Z"/><path class="glyph" d="M359.44 0V14H373.44"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="288.44" y="19.1">Changelog entry</tspan></text></g><g class="node type-box role-success" id="dg-custom-node-light-n-release" data-id="release"><rect class="shape" x="423.44" y="0" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="465.86" y="19.1">Release</tspan></text><g class="role-badge" data-role="success" transform="translate(508.28 0)"><circle class="badge" r="8"/><path class="glyph" d="M-3.5 0.5 -1 3 3.5 -2.5"/></g></g></g></svg>
