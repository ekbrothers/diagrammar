<svg xmlns="http://www.w3.org/2000/svg" class="dg-high-contrast-dark" viewBox="-25 -25 277.8 235.6" width="277.8" height="235.6" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-high-contrast-dark-title"><title id="dg-high-contrast-dark-title">High-contrast theme</title><style>.dg-high-contrast-dark{--dg-bg:#000000;--dg-text:#ffffff;--dg-text-muted:#e6e6e6;--dg-edge:#ffffff;--dg-group-fill:#000000;--dg-group-stroke:#ffffff;--dg-default-fill:#000000;--dg-default-stroke:#ffffff;--dg-default-text:#ffffff;--dg-primary-fill:#001a40;--dg-primary-stroke:#79b8ff;--dg-primary-text:#ffffff;--dg-success-fill:#00240d;--dg-success-stroke:#56d364;--dg-success-text:#ffffff;--dg-warning-fill:#2e2000;--dg-warning-stroke:#f0b72f;--dg-warning-text:#ffffff;--dg-danger-fill:#3d0008;--dg-danger-stroke:#ff7b72;--dg-danger-text:#ffffff;--dg-muted-fill:#1a1a1a;--dg-muted-stroke:#c9c9c9;--dg-muted-text:#ffffff}
.dg-high-contrast-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-high-contrast-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-high-contrast-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-high-contrast-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-high-contrast-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-high-contrast-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-high-contrast-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-high-contrast-dark text{font-family:inherit}
.dg-high-contrast-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:2.5px}
.dg-high-contrast-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-high-contrast-dark .card .shape{filter:none}
.dg-high-contrast-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-high-contrast-dark .role-primary .shape{stroke-width:4.25px}
.dg-high-contrast-dark .lbl{fill:var(--text);font-size:14px}
.dg-high-contrast-dark .card .lbl{font-weight:600}
.dg-high-contrast-dark .sub{fill:var(--text);font-size:12px}
.dg-high-contrast-dark .icon{color:var(--text)}
.dg-high-contrast-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:2.5px}
.dg-high-contrast-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-high-contrast-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-high-contrast-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-high-contrast-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-high-contrast-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-high-contrast-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-high-contrast-dark .canvas{fill:var(--dg-bg)}
.dg-high-contrast-dark.dim .node:not(.hot),.dg-high-contrast-dark.dim .edge:not(.hot),.dg-high-contrast-dark.dim .edge-label-group:not(.hot){opacity:.3}
.dg-high-contrast-dark a{cursor:pointer}
.dg-high-contrast-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="277.8" height="235.6" rx="4"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1" data-from="req" data-to="ok"><title>Request to Served</title><path class="edge-line" d="M84.84 28.65L104.84 28.65L104.84 97.3L134.84 97.3"/><path class="arrow" d="M134.84 97.3L125.84 101.8L125.84 92.8z"/></g><g class="edge" data-id="e2" data-from="req" data-to="retry"><title>Request to Retried</title><path class="edge-line" stroke-dasharray="6 4" d="M84.84 38.2L94.84 38.2L94.84 175.5L134.84 175.5"/><path class="arrow" d="M134.84 175.5L125.84 180L125.84 171z"/></g><g class="edge" data-id="e3" data-from="req" data-to="fail"><title>Request to Rejected</title><path class="edge-line" stroke-dasharray="0.1 5" d="M84.84 19.1L134.84 19.1"/><path class="arrow" d="M134.84 19.1L125.84 23.6L125.84 14.6z"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-box role-primary" id="dg-high-contrast-dark-n-req" data-id="req"><rect class="shape" x="0" y="9.55" width="84.84" height="38.2" rx="4"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="42.42" y="28.65">Request</tspan></text></g><g class="node type-box role-success" id="dg-high-contrast-dark-n-ok" data-id="ok"><rect class="shape" x="134.84" y="78.2" width="76.72" height="38.2" rx="4"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="173.2" y="97.3">Served</tspan></text><g class="role-badge" data-role="success" transform="translate(211.56 78.2)"><circle class="badge" r="8"/><path class="glyph" d="M-3.5 0.5 -1 3 3.5 -2.5"/></g></g><g class="node type-box role-warning" id="dg-high-contrast-dark-n-retry" data-id="retry"><rect class="shape" x="134.84" y="156.4" width="84.84" height="38.2" rx="4"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="177.26" y="175.5">Retried</tspan></text><g class="role-badge" data-role="warning" transform="translate(219.68 156.4)"><path class="badge" d="M0 -9 9 7H-9z"/><path class="glyph" d="M0 -3V1.5M0 4.3h.01"/></g></g><g class="node type-box role-danger" id="dg-high-contrast-dark-n-fail" data-id="fail"><rect class="shape" x="134.84" y="0" width="92.96" height="38.2" rx="4"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="181.32" y="19.1">Rejected</tspan></text><g class="role-badge" data-role="danger" transform="translate(227.8 0)"><rect class="badge" x="-6.5" y="-6.5" width="13" height="13" rx="2" transform="rotate(45)"/><path class="glyph" d="M-2.8 -2.8 2.8 2.8M2.8 -2.8-2.8 2.8"/></g></g></g></svg>
