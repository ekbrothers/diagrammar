<svg xmlns="http://www.w3.org/2000/svg" class="dg-pinned-dark" viewBox="-25 -25 671.08 263.2" width="671.08" height="263.2" style="max-width:100%;height:auto" role="img" aria-labelledby="dg-pinned-dark-title"><title id="dg-pinned-dark-title">Pinned nodes</title><style>.dg-pinned-dark{--dg-bg:#0d1117;--dg-text:#e6edf3;--dg-text-muted:#9ea7b3;--dg-edge:#9ea7b3;--dg-group-fill:#161b22;--dg-group-stroke:#8b949e;--dg-default-fill:#161b22;--dg-default-stroke:#8b949e;--dg-default-text:#e6edf3;--dg-primary-fill:#0c2d6b;--dg-primary-stroke:#58a6ff;--dg-primary-text:#cae8ff;--dg-success-fill:#0f2d1a;--dg-success-stroke:#3fb950;--dg-success-text:#b7f5c4;--dg-warning-fill:#3b2e00;--dg-warning-stroke:#d29922;--dg-warning-text:#ffe9a8;--dg-danger-fill:#4c0b12;--dg-danger-stroke:#f85149;--dg-danger-text:#ffd1cc;--dg-muted-fill:#161b22;--dg-muted-stroke:#8b949e;--dg-muted-text:#9ea7b3}
.dg-pinned-dark{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--dg-text)}
.dg-pinned-dark .role-default{--fill:var(--dg-default-fill);--stroke:var(--dg-default-stroke);--text:var(--dg-default-text);--es:var(--dg-default-stroke)}
.dg-pinned-dark .role-primary{--fill:var(--dg-primary-fill);--stroke:var(--dg-primary-stroke);--text:var(--dg-primary-text);--es:var(--dg-primary-stroke)}
.dg-pinned-dark .role-success{--fill:var(--dg-success-fill);--stroke:var(--dg-success-stroke);--text:var(--dg-success-text);--es:var(--dg-success-stroke)}
.dg-pinned-dark .role-warning{--fill:var(--dg-warning-fill);--stroke:var(--dg-warning-stroke);--text:var(--dg-warning-text);--es:var(--dg-warning-stroke)}
.dg-pinned-dark .role-danger{--fill:var(--dg-danger-fill);--stroke:var(--dg-danger-stroke);--text:var(--dg-danger-text);--es:var(--dg-danger-stroke)}
.dg-pinned-dark .role-muted{--fill:var(--dg-muted-fill);--stroke:var(--dg-muted-stroke);--text:var(--dg-muted-text);--es:var(--dg-muted-stroke)}
.dg-pinned-dark text{font-family:inherit}
.dg-pinned-dark .shape{fill:var(--fill);stroke:var(--stroke);stroke-width:1.5px}
.dg-pinned-dark .glyph{fill:none;stroke:var(--stroke);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-pinned-dark .card .shape{filter:drop-shadow(0 1px 2px rgba(31, 35, 40, 0.18))}
.dg-pinned-dark .role-muted .shape{stroke-dasharray:5 3}
.dg-pinned-dark .role-primary .shape{stroke-width:2.55px}
.dg-pinned-dark .lbl{fill:var(--text);font-size:14px}
.dg-pinned-dark .card .lbl{font-weight:600}
.dg-pinned-dark .sub{fill:var(--text);font-size:12px}
.dg-pinned-dark .icon{color:var(--text)}
.dg-pinned-dark .badge{fill:var(--dg-bg);stroke:var(--stroke);stroke-width:1.5px}
.dg-pinned-dark .edge-line{fill:none;stroke:var(--es,var(--dg-edge));stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
.dg-pinned-dark .arrow{fill:var(--es,var(--dg-edge));stroke:none}
.dg-pinned-dark .edge-label-box{fill:var(--dg-bg);stroke:none}
.dg-pinned-dark .edge-label{fill:var(--dg-text);font-size:12px}
.dg-pinned-dark .group-box{fill:var(--dg-group-fill);stroke:var(--dg-group-stroke);stroke-width:1px}
.dg-pinned-dark .group-label{fill:var(--dg-text-muted);font-size:12px;font-weight:600}
.dg-pinned-dark .canvas{fill:var(--dg-bg)}
.dg-pinned-dark a{cursor:pointer}
.dg-pinned-dark a:focus-visible{outline:2px solid var(--dg-primary-stroke);outline-offset:3px}</style><rect class="canvas" x="-25" y="-25" width="671.08" height="263.2" rx="8"/><g class="groups"></g><g class="edges"><g class="edge" data-id="e1"><title>Client to Gateway</title><path class="edge-line" d="M59.02 160L148.48 77.3"/><path class="arrow" d="M148.48 77.3L144.93 86.71L138.82 80.1z"/></g><g class="edge" data-id="e2"><title>Gateway to Users</title><path class="edge-line" d="M211.56 64.57L264.18 97.3L272.3 97.3"/><path class="arrow" d="M272.3 97.3L263.3 101.8L263.3 92.8z"/></g><g class="edge" data-id="e3"><title>Gateway to Billing</title><path class="edge-line" d="M211.56 51.83L264.18 19.1"/><path class="arrow" d="M264.18 19.1L258.91 27.67L254.16 20.03z"/></g><g class="edge" data-id="e4"><title>Users to Audit log</title><path class="edge-line" stroke-dasharray="6 4" d="M340.9 109.49L520 173.14"/><path class="arrow" d="M520 173.14L510.01 174.37L513.03 165.89z"/></g><g class="edge" data-id="e5"><title>Billing to Audit log</title><path class="edge-line" stroke-dasharray="6 4" d="M335.91 38.2L522.82 160"/><path class="arrow" d="M522.82 160L512.82 158.86L517.74 151.32z"/></g></g><g class="edge-labels"></g><g class="nodes"><g class="node type-box role-default" id="dg-pinned-dark-n-client" data-id="client"><rect class="shape" x="0" y="160" width="76.72" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="38.36" y="179.1">Client</tspan></text></g><g class="node type-box role-primary" id="dg-pinned-dark-n-gateway" data-id="gateway"><rect class="shape" x="126.72" y="39.1" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="169.14" y="58.2">Gateway</tspan></text></g><g class="node type-box role-default" id="dg-pinned-dark-n-users" data-id="users"><rect class="shape" x="272.3" y="78.2" width="68.6" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="306.6" y="97.3">Users</tspan></text></g><g class="node type-box role-default" id="dg-pinned-dark-n-billing" data-id="billing"><rect class="shape" x="264.18" y="0" width="84.84" height="38.2" rx="8"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="306.6" y="19.1">Billing</tspan></text></g><g class="node type-database role-muted" id="dg-pinned-dark-n-audit" data-id="audit"><path class="shape" d="M520 168a50.54 8 0 0 1 101.08 0v46.2a50.54 8 0 0 1 -101.08 0z"/><path class="glyph" d="M520 168a50.54 8 0 0 0 101.08 0"/><text class="lbl" text-anchor="middle" dominant-baseline="central"><tspan x="570.54" y="195.1">Audit log</tspan></text></g></g></svg>
